name: Ritmea Alpha CI (no deployment)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package*.json'
      - '.npmrc'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/alpha-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-build:
    name: Typecheck, lint, format, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    name: Browser E2E (Chromium desktop + mobile simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
