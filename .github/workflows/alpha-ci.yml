name: Ritmea Alpha CI (no deployment)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package*.json'
      - '.npmrc'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - '.github/workflows/alpha-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-build:
    name: Typecheck, lint, format, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: One-time Prettier fix for six reviewed UI files
        if: github.event.pull_request.head.repo.full_name == 'giandjcosta/Weight-Loss-Program' && github.head_ref == 'codex/ui-alpha-shell'
        run: |
          npx prettier --write index.html src/ui/App.tsx src/ui/model.test.ts src/ui/model.ts src/ui/styles.css tests/e2e/smoke.spec.ts
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html src/ui/App.tsx src/ui/model.test.ts src/ui/model.ts src/ui/styles.css tests/e2e/smoke.spec.ts
            git commit -m 'ChatGPT: format UI Alpha 0.1 with Prettier'
            git push origin HEAD:refs/heads/codex/ui-alpha-shell
          fi
      - run: npm run check
      - run: npm run build

  e2e:
    name: Browser E2E (Chromium desktop + mobile simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
